name: Playwright Tests
on:
  push:
    branches: [main, master, feat/idealy-live-backend]
  pull_request:
    branches: [main, master, feat/idealy-live-backend]

concurrency:
  group: idealy-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # These should be the same ones as used in production
      # Use a non-production secret only when the repository secret is unavailable.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'idealy-playwright-only-secret-change-me-32chars' }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      # E2E only: exercise the real workspace UI with the local test stream
      # and bypass login/database setup. This workflow variable is never used in production.
      DEMO_MODE: "true"
      # Keep normal client interactions (URL updates, controls); only server-side
      # authentication/database/AI calls use the local test mode.
      NEXT_PUBLIC_DEMO_MODE: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test

      - name: Print Playwright failure contexts
        if: failure()
        shell: bash
        run: |
          if [ -d test-results ]; then
            find test-results -type f -name 'error-context.md' -print -exec cat {} +
          else
            echo "No Playwright test-results directory was produced."
          fi

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

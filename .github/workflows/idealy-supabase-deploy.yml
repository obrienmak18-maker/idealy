name: Idealy Supabase Deploy

on:
  push:
    branches:
      - main
      - feat/idealy-live-backend
  workflow_dispatch:
    inputs:
      functions:
        description: "Fonctions Edge à déployer, séparées par des espaces"
        required: false
        default: "integration-connect integration-callback integration-status github-export process-ai-request orchestrate-mission mission-action-confirmation plugin-engine stripe-webhook check-subscription create-billing-portal create-checkout-session cancel-subscription refund-ai-credit designer-tools vercel-connect vercel-callback vercel-deploy vercel-status"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy canonical Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Verify migration source integrity
        run: |
          echo "Checking canonical migration files without pushing the remote schema."
          test -f supabase/migrations/20261011000000_power_purchases_and_reservations.sql
          test -f supabase/migrations/20261012020000_mission_file_event_compatibility.sql
          test -f supabase/migrations/20261012030000_power_reservations_repair.sql
          test -f supabase/migrations/20261012040000_power_v2_policy.sql
          test -f supabase/migrations/20261012050000_database_performance_hardening.sql
          test -f supabase/migrations/20261012060000_way_agent_runtime.sql
          test -f supabase/migrations/20261012070000_oauth_state_metadata.sql
          test -f supabase/migrations/20261012091000_missions_contract_alignment.sql
          test -f supabase/migrations/20261012092000_realtime_presence_authorization.sql
      - name: Deploy selected Edge functions
        env:
          FUNCTIONS: ${{ inputs.functions || 'integration-connect integration-callback integration-status github-export process-ai-request orchestrate-mission mission-action-confirmation plugin-engine stripe-webhook check-subscription create-billing-portal create-checkout-session cancel-subscription refund-ai-credit designer-tools vercel-deploy vercel-status' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase deployment blocked: GitHub secrets are not configured." >&2
            exit 1
          fi
          for function in $FUNCTIONS; do
            case "$function" in
              integration-callback|stripe-webhook)
                supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID"
                ;;
            esac
          done

  <title>Idealy — Design Mockup</title>
  <style>

x; font-size: clamp(38px,4vw,62px); line-height: .96; letter-spacing: -.06em; }.gen-hero p { max-width: 300px; margin: 20px 0 0; color: #74645c; font-size: 13px; line-height: 1.6; }.gen-reserve { display: inline-flex; gap: 8px; align-items: center; margin-top: 25px; border: 0; border-radius: 999px; padding: 11px 16px; color: white; background: #d96b4f; font-size: 10px; font-weight: 700; }.gen-image { min-height: 255px; display: flex; align-items: flex-end; border-radius: 34px; padding: 18px; background: linear-gradient(140deg, #d96b4f, #e6a25c, #f2d8a8); }.gen-image span { border-radius: 999px; padding: 8px 11px; color: #754437; background: rgba(255,245,220,.78); font-size: 10px; }.code-view, .data-view { height: 100%; overflow: auto; padding: 15px; color: #b9b1bb; background: #101016; font: 11px/1.8 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }.file-title { display: flex; justify-content: space-between; padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); color: #8c8490; font-size: 10px; }.code-line { display: flex; gap: 15px; }.code-no { width: 20px; color: #4e4853; text-align: right; }.code-key { color: var(--violet); }.code-tag { color: var(--cyan); }.data-view { font-family: inherit; }.data-heading { display: flex; align-items: center; justify-content: space-between; }.data-heading h3 { margin: 0; color: #eee7ee; font: 500 14px/1.4 inherit; }.data-heading p { margin: 5px 0 0; color: var(--subtle); font: 11px/1.5 inherit; }.data-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px; margin-top: 9px; border: 1px solid var(--line); border-radius: 11px; color: #d9d2da; background: rgba(255,255,255,.02); font-size: 11px; }.data-row span:last-child { color: var(--subtle); font-size: 10px; }.data-name { display: flex; gap: 8px; align-items: center; }.data-name i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); }.data-row:nth-child(3) .data-name i { background: var(--yellow); }.data-row:nth-child(4) .data-name i { background: var(--pink); }
    .drawer { position: absolute; right: 14px; top: 59px; z-index: 50; width: min(430px, 90vw); height: 260px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 13px; background: #0b0a0f; box-shadow: var(--shadow); animation: slideIn .16s ease both; }.drawer-tabs { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--line); }.drawer-tabs div { display: flex; gap: 4px; }.drawer-tab { border: 0; border-radius: 6px; padding: 6px 9px; color: var(--subtle); background: transparent; font-size: 10px; }.drawer-tab.active { color: white; background: rgba(255,255,255,.08); }.drawer-content { padding: 13px; color: #aaa2ad; font: 10px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; }.ok { color: var(--cyan); }.warn { color: var(--yellow); }.mock { color: var(--pink); }
    .toast { position: fixed; z-index: 100; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 13px; border: 1px solid var(--line); border-radius: 9px; color: #ded8df; background: #1b1821; box-shadow: var(--shadow); font-size: 11px; animation: slideIn .16s ease both; }
    .mobile-only { display: none; }
    @media (max-width: 900px) { .preview-panel { width: 48%; min-width: 300px; }.gen-hero { padding: 40px 25px; }.gen-links { display: none; }.way-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 720px) { .shell-header { padding: 15px; }.welcome-main { padding-top: 60px; }.starter-grid, .feature-grid, .context-grid { grid-template-columns: 1fr; }.feature-grid { margin-top: 65px; gap: 17px; }.lead { font-size: 14px; }.onboarding { padding: 15px; }.onboard-stage { padding-top: 48px; }.way-grid { grid-template-columns: 1fr 1fr; gap: 8px; }.way-card { min-height: 215px; padding: 15px; }.way-card h3 { font-size: 16px; }.stage-footer { margin-top: 20px; }.workspace { display: block; }.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 80; transform: translateX(-101%); width: 244px; box-shadow: var(--shadow); }.sidebar.open { transform: translateX(0); }.sidebar.collapsed { width: 244px; }.workspace-main { min-height: 100vh; }.workspace-body { display: block; }.chat-panel { min-height: 58vh; border-right: 0; border-bottom: 1px solid var(--line); }.chat-content { padding: 25px 17px 145px; }.bottom-composer { padding: 10px 15px 15px; }.preview-panel { width: 100%; min-width: 0; min-height: 560px; padding: 12px; }.topbar { padding: 0 6px; }.top-right .tab { display: none; }.top-right .btn.publish { display: none; }.mission-title { max-width: 155px; }.mobile-only { display: grid; }.empty-workspace { min-height: 43vh; }.empty-workspace h2 { font-size: 29px; }.empty-starters { grid-template-columns: 1fr; }.gen-hero { grid-template-columns: 1fr; padding: 35px 23px; }.gen-image { min-height: 180px; }.form-card { padding: 18px; }.context-grid { gap: 9px; } }
    @media (max-width: 440px) { h1 { font-size: 42px; }.way-grid { grid-template-columns: 1fr; }.way-card { min-height: 150px; }.onboard-stage h2 { font-size: 31px; }.starter { min-height: 52px; }.composer-row .outline { display: none; }.top-left .mission-title { max-width: 120px; } }

<body>
  <div id="app" class="app"></div>
  <div class="ambient"><div class="orb pink"></div><div class="orb cyan"></div><i class="star one"></i><i class="star two"></i></div>
  <script>
    (() => {
      const WAYS = {
        ninja: { name: 'Ninja', short: 'Rapide et direct', desc: 'Pour aller droit vers une première version claire.', color: '#d7d9e2', bg: 'linear-gradient(180deg, rgba(71,80,104,.45), rgba(12,11,16,0) 42%)' },
        mage: { name: 'Mage', short: 'Créatif et exploratoire', desc: 'Pour donner une forme neuve aux idées ouvertes.', color: '#c6a5ff', bg: 'linear-gradient(180deg, rgba(105,55,175,.45), rgba(12,11,16,0) 42%)' },
        hunter: { name: 'Hunter', short: 'Orienté résultat', desc: 'Pour viser une action concrète et mesurable.', color: '#f4cb76', bg: 'linear-gradient(180deg, rgba(142,77,27,.48), rgba(12,11,16,0) 42%)' },
        pro: { name: 'Pro', short: 'Précis et technique', desc: 'Pour garder une structure détaillée et contrôlable.', color: '#8edee2', bg: 'linear-gradient(180deg, rgba(25,91,100,.45), rgba(12,11,16,0) 42%)' }
      };
      const STARTERS = [
        'Une landing page élégante pour une pizzeria artisanale',
        'Un tableau de bord simple pour suivre mes dépenses',
        'Une page de réservation pour un salon de coiffure',
        'Une application pour organiser mes cours'
      ];
      const state = {
        screen: 'welcome', step: 1, way: 'pro', name: '', team: '', role: '', source: '',
        prompt: '', mission: '', phase: 'idle', tab: 'preview', console: false, consoleTab: 'terminal',
        sidebar: true, collapsed: false, listening: false, attach: false, helper: false, menu: false,
        expanded: false, history: [], toast: '', toastTimer: null, timer: null
      };
      const app = document.getElementById('app');
      const esc = (value) => String(value || '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
      const way = () => WAYS[state.way];
      const toast = (message) => { state.toast = message; clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2400); render(); };
      const icon = (value) => `<span aria-hidden="true">${value}</span>`;
      const wave = () => `<span class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>`;
      const logo = (markOnly = false) => `<div class="brand"><span class="brand-mark ${markOnly ? 'small' : ''}">✦</span>${markOnly ? '' : '<span class="brand-word">Idealy</span>'}</div>`;
      const topActions = () => `<div class="actions"><button class="btn subtle" onclick="window.idealy.toast('La connexion réelle sera branchée après la validation du design.')">Se connecter</button><button class="btn primary" onclick="window.idealy.goOnboard()">Commencer</button></div>`;
      const render = () => { app.innerHTML = state.screen === 'welcome' ? welcome() : state.screen === 'onboard' ? onboard() : workspace(); if (state.toast) document.body.insertAdjacentHTML('beforeend', `<div class="toast" role="status">${esc(state.toast)}</div>`); };
      const welcome = () => `
        <section class="screen welcome-screen">
          <header class="shell-header">${logo()}${topActions()}</header>
          <main class="welcome-main">
            <div class="center"><span class="eyebrow"><i>✦</i> Studio de création IA</span><h1>Qu’allons-nous <span class="gradient">construire</span> ?</h1><p class="lead">Décris une idée. Idealy l’aide à prendre forme, puis te montre une première application à explorer.</p></div>
            <div class="composer-wrap"><div class="composer-shell ${state.listening ? 'listening' : ''}"><div class="composer"><textarea id="welcomePrompt" rows="3" placeholder="Ex. Une application de réservation simple pour un petit restaurant…" oninput="window.idealy.setWelcome(this.value)">${esc(state.prompt)}</textarea>${state.attach ? '<div class="eyebrow" style="border-radius:7px;margin:5px 0 0;font-size:10px">⌕ brief-idee.pdf <button class="btn icon" style="width:18px;height:18px" onclick="window.idealy.toggleAttach()">×</button></div>' : ''}<div class="composer-row"><div class="icon-row"><button class="icon-btn" title="Joindre" onclick="window.idealy.toggleAttach()">⌕</button><button class="icon-btn" title="Image" onclick="window.idealy.toast('Import d’image simulé dans ce fichier.')">▧</button><button class="icon-btn" title="Figma" onclick="window.idealy.toast('Le connecteur Figma sera branché plus tard.')">◈</button><button class="icon-btn" title="GitHub" onclick="window.idealy.toast('Le connecteur GitHub sera branché plus tard.')">◉</button><button class="icon-btn ${state.listening ? 'active' : ''}" title="Dictée" onclick="window.idealy.dictate()">♩${state.listening ? wave() : ''}</button></div><div class="actions"><button class="btn outline" onclick="window.idealy.goOnboard()">Voir le parcours</button><button class="send" onclick="window.idealy.startWorkspace()" ${state.prompt.trim() ? '' : 'disabled'}>↑</button></div></div></div></div><p class="micro">Maquette autonome · aucune donnée n’est envoyée</p></div>
            <div class="starter-grid">${STARTERS.map((item) => `<button class="starter" onclick="window.idealy.setPrompt(decodeURIComponent('${encodeURIComponent(item)}'))"><span>${item}</span><span class="arrow">→</span></button>`).join('')}</div>
            <div class="feature-grid"><div class="feature"><b>✦</b><div><strong>Une idée suffit</strong>Pas besoin de connaître la bonne syntaxe pour commencer.</div></div><div class="feature"><b>⌘</b><div><strong>Une vraie preview</strong>Le résultat reste visible pendant que la mission avance.</div></div><div class="feature"><b>↗</b><div><strong>Prêt à explorer</strong>Le code et les données restent accessibles quand tu en as besoin.</div></div></div>
          </main>
        </section>`;
      const onboard = () => {
        const selected = way();
        const progress = state.step * 33.333;
        let body = '';
        if (state.step === 1) body = `<div class="center"><div class="eyebrow" style="color:var(--pink)">PREMIÈRE RENCONTRE</div><h2>Choisis ta voie</h2><p class="lead">Pas un niveau de prix. Une manière de créer, un vocabulaire et une énergie qui te ressemblent.</p></div><div class="way-grid">${Object.entries(WAYS).map(([id, item]) => `<button class="way-card ${state.way === id ? 'selected' : ''}" style="--way-color:${item.color};--way-bg:${item.bg}" onclick="window.idealy.selectWay('${id}')"><span class="select">${state.way === id ? '✓' : '○'}</span><div><div class="way-line"></div><h3>${item.name}</h3><div class="short">${item.short}</div><p>${item.desc}</p></div></button>`).join('')}</div><div class="stage-footer"><span>Voie sélectionnée : <b style="color:${selected.color}">${selected.name}</b></span><button class="btn primary" onclick="window.idealy.nextStep()">Continuer →</button></div>`;
        if (state.step === 2) body = `<div class="center"><div class="way-line" style="margin:0 auto;background:${selected.color}"></div><h2>Comment allons-nous t’appeler ?</h2><p class="lead">Ton nom apparaîtra dans les messages de tes agents.</p></div><div class="form-card"><label for="profileName">Nom de spécialiste</label><input id="profileName" class="input" autofocus value="${esc(state.name)}" placeholder="Ex. Amina, Naruto, Chris…" oninput="window.idealy.setName(this.value)"/><div class="sample">Aperçu de la première conversation<br/><strong>${selected.name}</strong> — « ${esc(state.name || 'Apprenti')}, que voulons-nous construire aujourd’hui ? »</div></div><div class="stage-footer" style="max-width:620px;margin-left:auto;margin-right:auto"><button class="btn subtle" onclick="window.idealy.prevStep()">Retour</button><button class="btn primary" onclick="window.idealy.nextStep()" ${state.name.trim() ? '' : 'disabled'}>Continuer →</button></div>`;
        if (state.step === 3) body = `<div class="center"><div style="color:var(--cyan);font-size:22px">✧</div><h2>Pour mieux t’accompagner</h2><p class="lead">Trois réponses suffisent. Elles servent à personnaliser ton premier espace, sans te faire perdre du temps.</p></div><div class="context-grid">${choiceGroup('Combien êtes-vous ?', 'team', ['Moi seul','2 à 10 personnes','11 à 50 personnes','51 personnes ou plus'])}${choiceGroup('Quel est ton rôle ?', 'role', ['Fondateur ou dirigeant','Indépendant ou freelance','Produit ou design','Développement ou technique','Étudiant ou curieux'])}${choiceGroup('Comment nous as-tu connus ?', 'source', ['Une recommandation','Une recherche sur internet','Une vidéo ou une démonstration','Une communauté ou un événement','Autre'])}</div><div class="stage-footer"><button class="btn subtle" onclick="window.idealy.prevStep()">Retour</button><button class="btn primary" onclick="window.idealy.enterWorkspace()" ${state.team && state.role && state.source ? '' : 'disabled'}>Entrer dans Idealy →</button></div><p class="micro">Parcours autonome · l’authentification réelle sera branchée séparément.</p>`;
        return `<section class="screen onboarding"><div class="onboard-top"><button class="btn icon" onclick="window.idealy.goWelcome()" title="Quitter">${icon('←')}</button><div class="progress-info"><span class="heart">♥</span><span>Ton espace prend forme</span><b>${state.step} / 3</b></div></div><div class="progress-line" style="--progress:${progress}%"></div><main class="onboard-stage">${body}</main></section>`;
      };
      const choiceGroup = (title, field, choices) => `<div class="choice-card"><h3>${title}</h3>${choices.map((item) => `<button class="choice ${state[field] === item ? 'selected' : ''}" onclick="window.idealy.choose('${field}',decodeURIComponent('${encodeURIComponent(item)}'))"><i class="radio"></i>${item}</button>`).join('')}</div>`;
      const workspace = () => {
        const hasMission = state.phase !== 'idle';
        return `<section class="workspace"><aside class="sidebar ${state.collapsed ? 'collapsed' : ''} ${state.sidebar ? 'open' : ''}" id="sidebar"><div class="side-head">${logo(true)}<button class="btn icon mobile-only" onclick="window.idealy.closeSidebar()">×</button></div><div class="side-content"><button class="new-mission" onclick="window.idealy.newMission()"><span style="color:var(--pink);font-size:17px">＋</span> Nouvelle mission</button></div><div class="side-title">Historique</div><div class="history-list">${hasMission ? historyItem(state.mission, true) : ''}${state.history.map((item) => historyItem(item, false)).join('')}${!hasMission && !state.history.length ? '<p style="padding:8px 12px;color:var(--subtle);font-size:11px;line-height:1.5">Tes missions apparaîtront ici.</p>' : ''}</div><div class="side-bottom"><div class="profile"><span class="avatar">${state.name ? esc(state.name[0].toUpperCase()) : selectedLetter()}</span><div><span style="font-size:11px">${esc(state.name || way().name)}</span><small>Maquette autonome</small></div><button class="btn icon" style="margin-left:auto" onclick="window.idealy.toast('Les paramètres seront branchés après validation.')">⚙</button></div><p class="side-note">Les connecteurs et l’authentification arrivent après la validation visuelle.</p></div></aside><main class="workspace-main">${hasMission ? topbar() : ''}${state.console ? drawer() : ''}<div class="workspace-body"><section class="chat-panel"><div class="chat-content"><div class="chat-inner">${hasMission ? missionThread() : emptyWorkspace()}</div></div>${composer()}</section>${hasMission ? previewPanel() : ''}</div></main></section>`;
      };
      const selectedLetter = () => way().name[0];
      const historyItem = (text, active) => `<button class="history-item ${active ? 'active' : ''}" onclick="window.idealy.loadMission(decodeURIComponent('${encodeURIComponent(text)}'))"><span class="history-icon">◷</span><span>${esc(text)}</span></button>`;
      const emptyWorkspace = () => `<div class="empty-workspace"><div class="eyebrow"><i>✦</i> Voie ${way().name}</div><h2>Qu’allons-nous construire ?</h2><p>Décris ton idée. Cette maquette simule la réflexion, la construction et la preview sans appeler de backend.</p><div class="empty-starters">${STARTERS.map((item) => `<button class="starter" onclick="window.idealy.setPrompt(decodeURIComponent('${encodeURIComponent(item)}'))"><span>${item}</span><span class="arrow">→</span></button>`).join('')}</div></div>`;
      const topbar = () => `<header class="topbar"><div class="top-left"><button class="btn icon" onclick="window.idealy.toggleSidebar()" title="Sidebar">☰</button><div class="relative"><button class="btn" onclick="window.idealy.toggleMenu()"><span class="mission-title">${esc(state.mission.length > 34 ? state.mission.slice(0,34) + '…' : state.mission)}</span>⌄</button>${state.menu ? `<div class="project-menu">${['Renommer','Ajouter aux favoris','Dupliquer','Télécharger en ZIP','Réglages'].map((item) => `<button onclick="window.idealy.menuAction(decodeURIComponent('${encodeURIComponent(item)}'))">✦ ${item}</button>`).join('')}</div>` : ''}</div></div><div class="top-right"><div class="tabs"><button class="tab" onclick="window.idealy.toast('Le mode design sera branché après validation.')">✦</button><button class="tab ${state.tab === 'preview' ? 'active preview' : ''}" onclick="window.idealy.setTab('preview')">▣ <span>Preview</span></button><button class="tab ${state.tab === 'code' ? 'active code' : ''}" onclick="window.idealy.setTab('code')">⌘ <span>Code</span></button><button class="tab ${state.tab === 'data' ? 'active data' : ''}" onclick="window.idealy.setTab('data')">▤ <span>Data</span></button><button class="tab ${state.console ? 'active' : ''}" onclick="window.idealy.toggleConsole()">▣</button></div><button class="btn subtle" onclick="window.idealy.toast('La publication est simulée dans ce fichier.')">Publier</button><button class="btn icon" onclick="window.idealy.toast('Menu projet simulé.')">•••</button></div></header>`;
      const missionThread = () => {
        const headline = state.phase === 'thinking' ? 'Réflexion en cours' : state.phase === 'building' ? 'Construction en cours' : 'Première version prête';
        const message = state.phase === 'thinking' ? 'Je transforme ton idée en intention claire, sans ouvrir encore la preview.' : state.phase === 'building' ? 'La structure prend forme. Les premiers écrans deviennent explorables dans la preview.' : 'La première version est prête. Tu peux maintenant regarder, modifier ou continuer la mission.';
        const steps = [['Intention comprise', `${way().name} reformule le résultat attendu`, state.phase !== 'thinking'], ['Structure préparée', 'Les écrans et les fichiers principaux prennent forme', state.phase === 'ready'], ['Preview construite', 'Une première version est prête à être explorée', state.phase === 'ready']];
        return `<div class="mission-thread"><div class="user-line"><span class="user-avatar">Toi</span><div class="user-message">${esc(state.mission)}</div></div><div class="agent-block ${state.expanded ? 'expanded' : ''}"><div class="agent-head" onclick="window.idealy.toggleExpanded()"><span class="agent-mark">I</span><span><span class="agent-title">${headline}<i class="status-dot"></i></span><span class="agent-sub">Escouade ${way().name} · étapes visibles, détails discrets</span></span><span class="chevron">⌄</span></div><div class="steps">${steps.map(([title, detail, done]) => `<div class="step ${done ? 'done' : ''}"><span class="step-dot">${done ? '✓' : '·'}</span><span><strong>${title}</strong><span>${detail}</span></span></div>`).join('')}</div><div class="agent-message">${message}</div></div></div>`;
      };
      const composer = () => `<div class="bottom-composer"><div class="bottom-inner"><div class="composer-meta"><span><strong>Voie ${way().name}</strong> · Entrée pour envoyer</span><span>Maj + Entrée pour une nouvelle ligne</span></div><div class="input-composer"><textarea id="composer" rows="2" placeholder="Décris ce que tu veux créer…" oninput="window.idealy.setPrompt(this.value)" onkeydown="window.idealy.keydown(event)">${esc(state.prompt)}</textarea><div class="composer-row"><div class="icon-row"><div class="relative"><button class="icon-btn ${state.attach ? 'active' : ''}" onclick="window.idealy.toggleAttach()" title="Joindre">⌕</button>${state.attach ? `<div class="composer-menu"><button onclick="window.idealy.closePopup();window.idealy.toast('Import simulé dans ce fichier.')">↥ Importer depuis l’ordinateur</button><button onclick="window.idealy.closePopup();window.idealy.toast('Le registre des connecteurs sera branché plus tard.')">⌁ Connecter un service</button><button onclick="window.idealy.closePopup();window.idealy.toast('Les plugins restent hors backend dans ce mockup.')">⊞ Ajouter un plugin</button></div>` : ''}</div><div class="relative"><button class="icon-btn ${state.helper ? 'active' : ''}" onclick="window.idealy.toggleHelper()" title="Améliorer l’idée">✦</button>${state.helper ? `<div class="composer-menu right"><button onclick="window.idealy.addHelper('Ajoute le résultat attendu et les personnes visées.')">✦ Préciser le résultat</button><button onclick="window.idealy.addHelper('Propose les pages principales et leur navigation.')">✦ Structurer les écrans</button><button onclick="window.idealy.addHelper('Suggère une direction visuelle cohérente.')">✦ Définir le style</button></div>` : ''}</div></div><div class="actions"><button class="icon-btn ${state.listening ? 'active' : ''}" onclick="window.idealy.dictate()" title="Dictée">♩${state.listening ? wave() : ''}</button><button class="send" onclick="window.idealy.submitMission()" ${state.prompt.trim() && !['thinking','building'].includes(state.phase) ? '' : 'disabled'}>↑</button></div></div></div><p class="micro">Aperçu local · aucune donnée n’est envoyée</p></div></div>`;
      const previewPanel = () => `<aside class="preview-panel"><div class="preview-tools"><span class="traffic"><i></i><i></i><i></i> preview.local</span><span><button class="btn icon" onclick="window.idealy.toast('Preview rafraîchie dans la maquette.')">⟲</button><button class="btn icon" onclick="window.idealy.toast('Ouverture externe simulée.')">⤢</button></span></div><div class="preview-frame">${state.phase !== 'ready' ? `<div class="loading-preview"><div><div class="loader"></div>${state.phase === 'thinking' ? 'Préparation de la structure…' : 'Construction de la preview…'}<small>La maquette montre l’attente, sans lancer de WebContainer.</small></div></div>` : state.tab === 'preview' ? generatedPreview() : state.tab === 'code' ? codeView() : dataView()}</div></aside>`;
      const generatedPreview = () => `<div class="generated-app"><nav class="gen-nav"><div class="gen-logo"><i></i>LUMA PIZZA</div><div class="gen-links"><span>Menu</span><span>Notre histoire</span><span>Réserver</span></div><button class="gen-cta">Commander</button></nav><section class="gen-hero"><div><div class="eyebrow">Fermentée lentement · cuite vite</div><h2>La pizza comme un moment.</h2><p>Des ingrédients simples, une pâte vivante et une table où l’on a envie de rester.</p><button class="gen-reserve">Réserver une table →</button></div><div class="gen-image"><span>Four à bois · depuis 2018</span></div></section></div>`;
      const codeView = () => { const lines = [`import { useState } from 'react';`, `import { ArrowRight } from 'lucide-react';`, ``, `export function PizzaHome() {`, `  const [menuOpen, setMenuOpen] = useState(false);`, ``, `  return (`, `    <main className="pizza-page">`, `      <nav className="topbar">`, `        <span className="wordmark">LUMA PIZZA</span>`, `        <button onClick={() => setMenuOpen(!menuOpen)}>Menu</button>`, `      </nav>`, `      <section className="hero">`, `        <p className="eyebrow">Fermentée lentement · cuite vite</p>`, `        <h1>La pizza comme un moment.</h1>`, `      </section>`, `    </main>`, `  );`, `}`]; return `<pre class="code-view"><div class="file-title"><span>⌑ src/PizzaHome.tsx</span><button class="btn icon" onclick="window.idealy.toast('Copie simulée.')">⧉</button></div>${lines.map((line, index) => `<div class="code-line"><span class="code-no">${index + 1}</span><span>${esc(line).replace(/(export|return|const|function)/g, '<b class="code-key">$1</b>').replace(/(className|onClick)/g, '<b class="code-tag">$1</b>')}</span></div>`).join('')}</pre>`; };
      const dataView = () => `<div class="data-view"><div class="data-heading"><div><h3>Données du projet</h3><p>Une vue calme des structures utiles à la preview.</p></div><span style="color:var(--yellow);font-size:17px">▤</span></div><div style="margin-top:18px"><div class="data-row"><span class="data-name"><i></i>reservations</span><span>24 lignes</span></div><div class="data-row"><span class="data-name"><i></i>menu_items</span><span>12 lignes</span></div><div class="data-row"><span class="data-name"><i></i>opening_hours</span><span>7 lignes</span></div></div></div>`;
      const drawer = () => `<div class="drawer"><div class="drawer-tabs"><div><button class="drawer-tab ${state.consoleTab === 'logs' ? 'active' : ''}" onclick="window.idealy.setConsoleTab('logs')">Logs</button><button class="drawer-tab ${state.consoleTab === 'terminal' ? 'active' : ''}" onclick="window.idealy.setConsoleTab('terminal')">Terminal</button></div><button class="btn icon" onclick="window.idealy.toggleConsole()">×</button></div>${state.consoleTab === 'terminal' ? '<div class="drawer-content"><span class="ok">$</span> npm run build<br><span class="ok">✓ preview compiled in 1.8s</span><br><span class="ok">$</span> _</div>' : '<div class="drawer-content"><span class="ok">info</span> intention-router: CONSTRUCTION<br><span class="warn">wait</span> preview locale<br><span class="mock">mock</span> aucune requête réseau</div>'}</div>`;

      window.idealy = {
        toast, setWelcome: (value) => { state.prompt = value; render(); focus('welcomePrompt'); }, setPrompt: (value) => { state.prompt = value; render(); focus(state.screen === 'welcome' ? 'welcomePrompt' : 'composer'); }, goOnboard: () => { state.screen = 'onboard'; state.step = 1; render(); }, goWelcome: () => { state.screen = 'welcome'; state.phase = 'idle'; render(); }, selectWay: (id) => { state.way = id; render(); }, setName: (value) => { state.name = value; render(); focus('profileName'); }, choose: (field, value) => { state[field] = value; render(); }, nextStep: () => { if (state.step === 1 || state.name.trim()) { state.step = Math.min(3, state.step + 1); render(); } }, prevStep: () => { state.step = Math.max(1, state.step - 1); render(); }, enterWorkspace: () => { if (state.team && state.role && state.source) { state.screen = 'workspace'; render(); } }, startWorkspace: () => { state.screen = 'workspace'; render(); if (state.prompt.trim()) setTimeout(() => document.getElementById('composer')?.focus(), 0); }, toggleAttach: () => { state.attach = !state.attach; state.helper = false; render(); }, toggleHelper: () => { state.helper = !state.helper; state.attach = false; render(); }, closePopup: () => { state.attach = false; state.helper = false; render(); }, addHelper: (addition) => { state.prompt = `${state.prompt.trim()}${state.prompt.trim() ? '\n\n' : ''}${addition}`; state.helper = false; render(); focus('composer'); }, dictate: () => { state.listening = !state.listening; render(); if (state.listening) { toast('Mode voix simulé : parle comme si Idealy t’écoutait.'); setTimeout(() => { state.listening = false; state.prompt = `${state.prompt.trim()}${state.prompt.trim() ? ' ' : ''}Une interface simple, élégante et publiable.`; render(); }, 1500); } }, submitMission: () => { const value = state.prompt.trim(); if (!value || ['thinking','building'].includes(state.phase)) return; if (state.mission && state.mission !== value) state.history.unshift(state.mission); state.history = [...new Set(state.history)].slice(0, 8); state.mission = value; state.prompt = ''; state.tab = 'preview'; state.console = false; state.phase = 'thinking'; render(); clearTimeout(state.timer); state.timer = setTimeout(() => { state.phase = 'building'; render(); }, 900); state.timer = setTimeout(() => { state.phase = 'ready'; render(); }, 2600); }, newMission: () => { if (state.mission) state.history.unshift(state.mission); state.history = [...new Set(state.history)].slice(0,8); state.mission = ''; state.prompt = ''; state.phase = 'idle'; state.console = false; state.tab = 'preview'; render(); }, loadMission: (value) => { state.mission = value; state.phase = 'ready'; state.tab = 'preview'; render(); }, toggleSidebar: () => { state.collapsed = !state.collapsed; state.sidebar = true; render(); }, closeSidebar: () => { state.sidebar = false; render(); }, setTab: (tab) => { state.tab = tab; render(); }, toggleConsole: () => { state.console = !state.console; render(); }, setConsoleTab: (tab) => { state.consoleTab = tab; state.console = true; render(); }, toggleExpanded: () => { state.expanded = !state.expanded; render(); }, toggleMenu: () => { state.menu = !state.menu; render(); }, menuAction: (item) => { state.menu = false; render(); toast(`${item} est simulé dans ce fichier.`); }, keydown: (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); window.idealy.submitMission(); } }
      };
      function focus(id) { setTimeout(() => { const element = document.getElementById(id); if (element) { element.focus(); element.setSelectionRange?.(element.value.length, element.value.length); } }, 0); }
      render();
    })();
  </script>

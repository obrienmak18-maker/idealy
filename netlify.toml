[build]
  # Commande de build explicite pour publier l’application opérationnelle Zeno
  # et conserver les autres packages du monorepo indépendants
  command = "pnpm --filter @workspace/zeno run build"
  
  # Dossier de publication correspondant à la sortie du build Vite de Zeno
  publish = "artifacts/zeno/dist/public"

[build.environment]
  # Variables d'environnement pour le build
  NODE_VERSION = "20"
  PNPM_VERSION = "10.30.3"
  
  # Configuration pnpm pour le build
  NPM_FLAGS = "--no-frozen-lockfile"

# Redirections pour gérer le routing client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers pour améliorer la sécurité et les performances
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

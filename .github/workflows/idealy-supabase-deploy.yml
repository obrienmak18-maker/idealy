name: Idealy Supabase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy canonical Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase deployment skipped: GitHub secrets are not configured."
            exit 0
          fi
          for function in \
            ai-proxy \
            cancel-subscription \
            check-subscription \
            create-billing-portal \
            create-checkout-session \
            designer-tools \
            github-export \
            integration-callback \
            integration-connect \
            integration-status \
            process-ai-request \
            refund-ai-credit \
            stripe-webhook \
            vercel-deploy \
            vercel-status; do
            if [ "$function" = "stripe-webhook" ] || [ "$function" = "integration-callback" ]; then
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            else
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done

name: Sidealy Workspace Quality

on:
  push:
    branches:
      - feat/canvas-runtime
  pull_request:
    branches:
      - main
      - feat/idealy-live-backend
      - feat/canvas-runtime

permissions:
  contents: read

concurrency:
  group: sidealy-workspace-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidealy:
    name: Sidealy typecheck, production build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sidealy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: sidealy/package-lock.json

      - name: Verify Sidealy deployment routing contract
        run: node scripts/verify-vercel-config.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and build production bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

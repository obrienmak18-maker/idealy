name: Deploy Idealy

on:
  push:
    branches:
      - main
      - feat/idealy-complete-system
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/idealy run build

  webhook-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run local Stripe webhook integration test
        env:
          STRIPE_WEBHOOK_SECRET: whsec_idealy_ci_test
          TEST_STRIPE_PRICE_ID_PRO: price_test_pro
          TEST_STRIPE_PRICE_ID_BUSINESS: price_test_business
        run: pnpm test:webhook:local

  deploy:
    needs: [build, webhook-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/idealy run build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Supabase functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "Supabase deployment skipped: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID are not configured in GitHub Secrets."
            exit 0
          fi
          supabase functions deploy ai-proxy --project-ref "$PROJECT_ID"
          supabase functions deploy process-ai-request --project-ref "$PROJECT_ID"
          supabase functions deploy create-checkout-session --project-ref "$PROJECT_ID"
          supabase functions deploy create-billing-portal --project-ref "$PROJECT_ID"
          supabase functions deploy check-subscription --project-ref "$PROJECT_ID"
          supabase functions deploy cancel-subscription --project-ref "$PROJECT_ID"
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy github-export --project-ref "$PROJECT_ID"
          supabase functions deploy integration-connect --project-ref "$PROJECT_ID"
          supabase functions deploy integration-status --project-ref "$PROJECT_ID"
          supabase functions deploy vercel-deploy --project-ref "$PROJECT_ID"
          supabase functions deploy vercel-status --project-ref "$PROJECT_ID"
          supabase functions deploy integration-callback --project-ref "$PROJECT_ID" --no-verify-jwt

name: Idealy Live Quality

on:
  push:
    branches:
      - feat/idealy-live-backend
  pull_request:
    branches:
      - main
      - feat/idealy-live-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-next:
    name: Backend parity and Next build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Idealy backend manifest
        run: pnpm backend:verify

      - name: Typecheck application
        run: pnpm typecheck

      - name: Design Engine contract
        run: pnpm test:design-engine

      - name: Mission files contract
        run: pnpm test:mission-files

      - name: Connector registry contract
        run: pnpm test:connectors

      - name: Authentication outcome contract
        run: pnpm test:auth-outcome

      - name: Demo multi-agent program contract
        run: pnpm test:demo-program

      - name: Mission squad contract
        run: node scripts/test-mission-squad-contract.mjs

      - name: Intent routing contract
        run: node scripts/test-intent-routing.mjs

      - name: Supabase table contract
        run: node scripts/test-supabase-table-contract.mjs

      - name: External action confirmation contract
        run: node scripts/test-external-action-confirmation-contract.mjs

      - name: Billing security contract
        run: node scripts/test-billing-security-contract.mjs

      - name: Shared external connector guard
        run: node scripts/test-shared-external-connector-guard.mjs

      - name: Legacy API security contract
        run: node scripts/test-legacy-api-security-contract.mjs

      - name: Chat request contract
        run: node scripts/test-chat-request-contract.mjs

      - name: Next AI proxy contract
        run: node scripts/test-next-ai-proxy-contract.mjs

      - name: Agent personas contract
        run: node scripts/test-agent-personas-contract.mjs

      - name: Product way and power contract
        run: node scripts/test-product-contract.mjs

      - name: Onboarding profile contract
        run: pnpm test:onboarding

      - name: Local workspace demo contract
        run: node scripts/test-local-workspace-demo-contract.mjs

      - name: Workspace event replay contract
        run: node scripts/test-workspace-event-replay-contract.mjs

      - name: Build application
        run: pnpm build

  supabase-local:
    name: Local Supabase migration and RLS contract
    needs: backend-and-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Évite une résolution GitHub de `latest`, susceptible d'être rate-limitée.
          version: 2.116.0

      - name: Release stale local Supabase ports
        run: |
          sudo fuser -k 54321/tcp || true
          sudo fuser -k 54322/tcp || true
          sudo fuser -k 54323/tcp || true
          docker ps -aq --filter name=supabase_idealy | xargs -r docker rm -f

      - name: Start local Supabase database
        run: supabase db start

      - name: Reset local database from migrations
        run: supabase db reset --no-seed

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration and RLS contract
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/mission-files.sql
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/billing-integrity.sql
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/mission-agent-orchestration.sql
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/product-profile-foundations.sql
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/power-system-v1.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  webhook-test:
    name: Local Stripe webhook contract
    needs: backend-and-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local Stripe webhook contract
        env:
          STRIPE_WEBHOOK_SECRET: whsec_idealy_ci_test
          TEST_STRIPE_PRICE_ID_PRO: price_test_pro
          TEST_STRIPE_PRICE_ID_BUSINESS: price_test_business
        run: pnpm test:webhook:local

name: Idealy Supabase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      functions:
        description: "Fonctions Edge à déployer, séparées par des espaces"
        required: false
        default: "integration-connect integration-callback integration-status github-export process-ai-request"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy canonical Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy selected Edge functions
        env:
          FUNCTIONS: ${{ inputs.functions || 'integration-connect integration-callback integration-status github-export process-ai-request' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Supabase deployment skipped: GitHub secrets are not configured."
            exit 0
          fi
          for function in $FUNCTIONS; do
            case "$function" in
              integration-callback|stripe-webhook)
                supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
                ;;
              *)
                supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_ID"
                ;;
            esac
          done
